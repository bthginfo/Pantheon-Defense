[workspace]
members = ["crates/simulation", "crates/arena"]
resolver = "3"

# Whole-program optimisation keeps the browser renderer about a quarter smaller,
# which phones download and compile on every cold start.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

